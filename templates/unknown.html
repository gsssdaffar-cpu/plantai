<!DOCTYPE html>
<html>

<head>

    <title>Unknown Plant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<div class="alert alert-warning">

    <h2>⚠ Plant Not Recognized</h2>

    <hr>

    <img src="/uploads/{{image}}" width="300" class="img-thumbnail">

    <br><br>

    <h4>Prediction Confidence</h4>

    <h3>{{confidence}}%</h3>

    <p>

        The uploaded image does not match any plant currently supported by PlantAI
        with sufficient confidence.

    </p>

    <h5>Currently Supported Plants</h5>

    <ul>

        <li>🍅 Tomato</li>
        <li>🥔 Potato</li>
        <li>🫑 Bell Pepper</li>

    </ul>

    <a href="/" class="btn btn-success">

        Try Another Image

    </a>

</div>

</body>

</html>
