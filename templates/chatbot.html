<!DOCTYPE html>

<html>

<head>

<title>PlantAI Assistant</title>


<style>

body{

font-family:Arial;
background:#f1f8e9;
padding:20px;

}


.container{

max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;

}


h1{

color:#2e7d32;
text-align:center;

}


textarea{

width:100%;
height:100px;
padding:10px;

}


button{

background:#388e3c;
color:white;
padding:12px 25px;
border:none;
border-radius:8px;

}


.answer{

margin-top:20px;
background:#f9fbe7;
padding:20px;
white-space:pre-line;
border-radius:10px;

}

</style>

</head>


<body>


<div class="container">


<h1>
🤖 PlantAI Assistant
</h1>


<form method="POST">


<textarea 
name="question"
placeholder="Ask about plant disease..."
required></textarea>


<br><br>


<button>

Ask PlantAI

</button>


</form>




{% if answer %}

<div class="answer">

{{answer}}

</div>

{% endif %}



</div>


</body>


</html>
